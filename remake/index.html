<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conflict: Korea 리메이크 · 프로토타입</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Conflict: Korea</strong>
      <span id="scenario-name">-</span>
    </div>
    <button id="new-game" class="btn" type="button" title="시나리오와 게임 설정을 골라 새로 시작">새 게임</button>
    <button id="save-game" class="btn" type="button" title="게임 저장·불러오기" aria-pressed="false">저장</button>
    <button id="reports-btn" class="btn" type="button" title="전략 보고·항구와 비행장·날씨·시나리오 정보·전략 개관" aria-pressed="false">보고서</button>
    <button id="sound" class="btn" type="button" title="소리·진행 설정: 배경 음악, 효과음, 진행 속도, 이동 따라가기" aria-pressed="false">♪ 설정</button>
    <div class="info">
      <span id="date" class="date">-</span>
      <div id="phase" class="phase-pill">-</div>
      <span id="weather" class="top-chip">-</span>
      <span id="victory" class="top-chip">-</span>
    </div>
    <div class="spacer"></div>
    <button id="air-ops" class="btn" type="button" title="항공대 임무 정하기 (1차 명령 단계)" aria-pressed="false">✈ 항공</button>
    <button id="end-phase" class="btn primary" type="button" title="이 단계의 명령을 마치고 다음 단계로">단계 종료 ▶</button>
    <details id="layers-menu" class="layers-menu">
      <summary class="btn" id="layers-btn">지도 표시 ▾</summary>
    <div class="group layers" role="group" aria-label="표시 레이어">
      <button data-layer="possession" type="button">점령지</button>
      <button data-layer="supply" type="button">보급망</button>
      <button data-layer="units" type="button">부대</button>
      <button data-layer="names" type="button">지명</button>
      <button data-layer="nature" type="button" title="산·호수·산맥 이름">산·호수</button>
      <button data-layer="grid" type="button">격자</button>
      <button data-layer="coords" type="button">좌표</button>
    </div>
    </details>
    <div class="group" role="group" aria-label="확대">
      <button id="zoom-out" type="button" title="축소">−</button>
      <button id="zoom-in" type="button" title="확대">+</button>
      <button id="zoom-fit" type="button" title="전체 보기">전체</button>
    </div>
  </header>
  <main class="layout">
    <div class="map-wrap">
      <canvas id="map"></canvas>
      <div id="status" class="status">지도 위에 마우스를 올려 보세요</div>
      <div id="combat-replay" class="replay" hidden></div>
      <div id="banner" class="banner" hidden></div>
      <div id="newgame" class="banner newgame-wrap" hidden></div>
      <div id="savegame" class="banner newgame-wrap savegame-wrap" hidden></div>
      <div id="reports" class="banner newgame-wrap reports-wrap" hidden></div>
      <div id="organize" class="banner newgame-wrap organize-wrap" hidden></div>
      <div id="sound-panel" class="sound-panel" hidden></div>
    </div>
    <aside id="panel" class="panel"><section class="card"><p class="muted">불러오는 중...</p></section></aside>
  </main>
  <div id="title-screen" class="title-screen" hidden></div>
  <script type="module" src="src/main.ts"></script>
</body>
</html>
